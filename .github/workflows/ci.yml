name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26.04 in a
    # rollout starting 19 October 2026 (actions/runner-images#14748), so a
    # floating label would change the gate's operating system with no commit.
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
