name: Publish

# Publishes to npm and creates the GitHub release when a version tag is pushed:
#   npm run release -- patch      # npm version + git push --follow-tags
#
# Needs the NPM_TOKEN repository secret (npm granular access token, read/write
# on the @mahope scope, bypass 2FA). Provenance is attached via GitHub OIDC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26.04 in a
    # rollout starting 19 October 2026 (actions/runner-images#14748). The image
    # carries GitHub CLI 2.101.0, which is what "gh release create" below needs.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the step below can ask whether the tagged commit is
          # on the default branch. A shallow clone cannot answer that.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Test
        run: npm test --if-present

      - name: Refuse to publish if the tag does not match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match package.json version $version"
              exit 1
            fi
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Refuse to publish a tag that is not on the default branch
        if: github.event_name == 'push'
        run: |
          default="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$default"; then
            echo "::error::$RELEASE_TAG is not on $default. Publishing it would put a version on npm that $default does not contain, and npm versions cannot be taken back. Merge the commit into $default and push the tag from there."
            exit 1
          fi
          echo "$RELEASE_TAG is on $default"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --generate-notes
          fi
