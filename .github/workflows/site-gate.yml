name: Site gate

# Kører kun når sitet eller dets låste værktøjssæt røres, så PR'er der ikke
# rører sitefiler ikke bærer Chromium-tiden. Udadvende deploy er ikke en del
# af denne workflow; tools/verify_workflows.mjs håndhæver det i npm test.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/site_gate.sh"
      - "tools/site_gate_selftest.py"
      - "tools/seo_check.py"
      - "tools/site_chrome.py"
      - "tools/layout_check.py"
      - "tools/site-requirements.in"
      - "tools/site-requirements.txt"
      - "package.json"
      - ".github/workflows/site-gate.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/site_gate.sh"
      - "tools/site_gate_selftest.py"
      - "tools/seo_check.py"
      - "tools/site_chrome.py"
      - "tools/layout_check.py"
      - "tools/site-requirements.in"
      - "tools/site-requirements.txt"
      - "package.json"
      - ".github/workflows/site-gate.yml"

permissions:
  contents: read

jobs:
  site:
    # Pinned to 24.04, not the newest image and not ubuntu-latest, on purpose.
    # Playwright 1.60.0 ships a hardcoded apt-package list per Ubuntu major and
    # has no entry for 26.04; on 26.04 `playwright install-deps` prints "Cannot
    # install dependencies for ubuntu26.04-x64" and exits 0, so the
    # TRANSMUTE_PLAYWRIGHT_DEPS step below would install nothing and this gate
    # would run Chromium against unverified system libraries. Move this to
    # ubuntu-26.04 in the same commit that bumps Playwright far enough and
    # shows this gate green there; tools/verify_contract.mjs enforces both
    # halves of that rule.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Site-gate (SEO, layout, selftest)
        env:
          TRANSMUTE_PLAYWRIGHT_DEPS: "1"
        run: npm run check:site
      - name: pip-audit på de hash-låste siteværktøjer
        run: npm run audit:site
