<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmute</title>
  <style>
    :root {
      --bg: #0f0f13; --surface: #18181d; --border: #2a2a32;
      --text: #e4e4e7; --dim: #8a8a96; --accent: #6366f1; --accent-hover: #818cf8;
      --green: #22c55e; --red: #ef4444; --code-bg: #1e1e24;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
    header h1 span { color: var(--accent); }
    .tier-badge { font-size: 0.75rem; color: var(--dim); background: var(--surface); border: 1px solid var(--border); padding: 3px 10px; border-radius: 100px; }
    .tier-badge.pro { color: var(--green); border-color: var(--green); }

    main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; overflow-y: auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .box { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
    .box label { font-size: 0.78rem; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    textarea, select {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; color: var(--text); font-family: var(--mono); font-size: 0.82rem;
      resize: vertical; width: 100%;
    }
    textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 180px; }
    #outputPane { min-height: 180px; white-space: pre; overflow-x: auto; }

    .pipeline-row { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 8px; align-items: center; }
    .pipeline-row button.rm {
      background: none; border: none; color: var(--dim); cursor: pointer; font-size: 0.9rem; padding: 4px;
    }
    .pipeline-row button.rm:hover { color: var(--red); }
    input[type="text"], input[type="number"] {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 10px; color: var(--text); font-family: var(--mono); font-size: 0.82rem; width: 100%;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .expr-input { grid-column: 3 / 5; }
    #addStep { margin-top: 8px; }

    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); }
    .btn-link { background: none; color: var(--accent); padding: 6px 0; font-size: 0.85rem; }
    .btn-link:hover { color: var(--accent-hover); }

    .status-line { font-size: 0.8rem; color: var(--dim); }
    .error-banner, .limit-banner {
      display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; line-height: 1.45;
    }
    .error-banner { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4); color: #fca5a5; }
    .limit-banner {
      background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.4); color: #fcd34d;
      justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .limit-banner a { color: #fcd34d; font-weight: 600; }

    /* License section */
    #licenseSection { border-top: 1px solid var(--border); padding: 12px 20px; font-size: 0.85rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #licenseSection .muted { color: var(--dim); }
    #licenseForm { display: flex; gap: 8px; flex: 1; max-width: 520px; }
    #licenseForm input { flex: 1; }
    .hidden { display: none !important; }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .pipeline-row { grid-template-columns: auto 1fr auto; }
      .expr-input { grid-column: 2 / 3; }
      .pipeline-row .param { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

<header>
  <h1>Trans<span>mute</span></h1>
  <span id="tierBadge" class="tier-badge">Free — 3 runs per launch</span>
</header>

<main>
  <div id="limitBanner" class="limit-banner">
    <span>Free version runs 3 transformations per launch. Upgrade to Pro for unlimited use.</span>
    <a href="#" id="buyLink">Buy Pro — $19 one-time →</a>
  </div>
  <div id="errorBanner" class="error-banner"></div>

  <div class="grid">
    <div class="box">
      <label for="inputData">Input</label>
      <textarea id="inputData" spellcheck="false" placeholder="Paste JSON, CSV, YAML or XML…">[{"name":"Alice","age":32,"role":"admin"},{"name":"Bob","age":25,"role":"user"},{"name":"Charlie","age":38,"role":"admin"}]</textarea>
    </div>
    <div class="box">
      <label for="outputPane">Output</label>
      <textarea id="outputPane" readonly spellcheck="false" placeholder="Result appears here…"></textarea>
    </div>
  </div>

  <div class="controls">
    <select id="inputFormat" aria-label="Input format">
      <option value="">Auto-detect</option>
      <option value="json">JSON in</option>
      <option value="csv">CSV in</option>
      <option value="yaml">YAML in</option>
      <option value="xml">XML in</option>
    </select>
    <span style="color:var(--dim)">→</span>
    <select id="outputFormat" aria-label="Output format">
      <option value="json">JSON out</option>
      <option value="csv">CSV out</option>
      <option value="yaml">YAML out</option>
      <option value="xml">XML out</option>
      <option value="table">Table out</option>
      <option value="sql">SQL INSERTs</option>
    </select>
    <button id="runBtn" class="btn btn-primary">Run ▸</button>
    <span id="runsLeft" class="status-line"></span>
  </div>

  <details open>
    <summary style="cursor:pointer;color:var(--dim);font-size:.85rem;margin-bottom:8px;">Pipeline steps</summary>
    <div id="pipeline"></div>
    <button id="addStep" class="btn btn-link">+ Add step</button>
  </details>
</main>

<div id="licenseSection">
  <div id="licenseFree" class="controls" style="gap:8px;">
    <span class="muted">Transmute Free · $19 Pro unlocks unlimited transformations</span>
    <a href="#" id="buyLink2" style="color:var(--accent);font-weight:600;">Buy Pro →</a>
    <button id="showLicenseBtn" class="btn btn-secondary" style="padding:6px 14px;font-size:.8rem;">Activate license</button>
  </div>
  <div id="licenseForm" class="hidden">
    <input type="text" id="licenseInput" placeholder="License key from your purchase email" aria-label="License key">
    <button id="activateBtn" class="btn btn-primary" style="padding:7px 14px;font-size:.8rem;">Activate</button>
    <button id="cancelLicenseBtn" class="btn btn-link">Cancel</button>
  </div>
  <div id="licenseActive" class="hidden controls" style="gap:8px;">
    <span style="color:var(--green);font-weight:600;" id="licensedAs">✓ Pro activated</span>
    <button id="deactivateBtn" class="btn btn-secondary" style="padding:6px 14px;font-size:.8rem;">Deactivate</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
