[package]
name = "transmute"
version = "0.1.0"
edition = "2021"
description = "Desktop data transformer — JSON, CSV, YAML, XML pipelines, offline and private"

[lib]
name = "transmute_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["native-tls-vendored", "json"] }
chrono = { version = "0.4", features = ["serde"] }
